draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 70.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: true
  n_columns: 1
  separate_combo_diagrams: false
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  draw_key_sides: false
  footer_text: ''
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyph_urls:
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
  svg_extra_style: |
    svg.keymap { background-color: #1e1e2e; }
    text.layer-activator { display: none; text-decoration: none; }
    svg.layer-summary text.layer-activator { display: inline; }
    rect.key { fill: #313244; }
    rect.key, rect.combo { stroke: #45475a; }
    rect.combo, rect.combo-separate { fill: #181825; }
    path.combo { stroke: #6c7086; stroke-width: 2; stroke-dasharray: 2 3; opacity: 0.7; fill: none; }
    rect.key.meta-escape-trigger, rect.combo.meta-escape { stroke: #aa4499; }
    text.combo.meta-escape, svg.combo.meta-escape { fill: #aa4499; }
    rect.key.meta-tab-trigger, rect.combo.meta-tab { stroke: #88ccee; }
    text.combo.meta-tab, svg.combo.meta-tab { fill: #88ccee; }
    rect.key.meta-enter-trigger, rect.combo.meta-enter { stroke: #44aa99; }
    text.combo.meta-enter, svg.combo.meta-enter { fill: #44aa99; }
    rect.key.meta-backspace-trigger, rect.combo.meta-backspace { stroke: #ddcc77; }
    text.combo.meta-backspace, svg.combo.meta-backspace { fill: #ddcc77; }
    rect.key.meta-delete-trigger, rect.combo.meta-delete { stroke: #cc6677; }
    text.combo.meta-delete, svg.combo.meta-delete { fill: #cc6677; }
    rect.key[class*="meta-"][class*="-trigger"] { stroke-width: 2.5; }
    rect.combo.meta-delete-inset { fill: none; stroke: #cc6677; stroke-width: 2; rx: 4px; ry: 4px; }
    rect.combo.meta-combo { fill: #181825; }
    svg.combo.meta-combo.tap { width: 17px; height: 17px; transform: translate(-20px, 0); }
    text.combo.meta-combo.hold { font-size: 11px; text-anchor: start; dominant-baseline: central; transform: translate(-7px, -10px); }
    rect.mod { fill: #181825; }
    text.label { stroke: none; }
    .layer-Graphium text, .layer-Graphium .glyph, .layer-Graphium rect.held { fill: #cdd6f4; }
    .layer-Vestnik text, .layer-Vestnik .glyph, .layer-Vestnik rect.held { fill: #cba6f7; }
    .layer-Vestnik .key.shifted { fill: #ff6b6b; }
    .layer-Nav text, .layer-Nav .glyph, .layer-Nav rect.held { fill: #89b4fa; }
    .layer-Sym text, .layer-Sym .glyph, .layer-Sym rect.held, .layer-SymNum text, .layer-SymNum .glyph, .layer-SymNum rect.held { fill: #a6e3a1; }
    .layer-SymNum text.symnum-number.tap { fill: #fab387; }
    .layer-Num text, .layer-Num .glyph, .layer-Num rect.held { fill: #fab387; }
    .layer-Fn text, .layer-Fn .glyph, .layer-Fn rect.held { fill: #f9e2af; }
    .layer-Mouse text, .layer-Mouse .glyph, .layer-Mouse rect.held { fill: #94e2d5; }
    text.held { fill: #1e1e2e; }
    text.trans { fill: #6c7086; }
    rect.nav-activator, rect:has(~ a[href="#Nav"]) { stroke: #89b4fa; stroke-width: 2; }
    rect.sym-activator, rect.symnum-activator, rect:has(~ a[href="#Sym"]), rect:has(~ a[href="#SymNum"]) { stroke: #a6e3a1; stroke-width: 2; }
    rect.num-activator, rect:has(~ a[href="#Num"]) { stroke: #fab387; stroke-width: 2; }
    rect.key.mouse-activator, rect.key:has(~ a[href="#Mouse"]) { stroke: #94e2d5; stroke-width: 2; }
    rect.key.fn-activator, rect.key:has(~ a[href="#Fn"]) { stroke: #f9e2af; stroke-width: 2; }
    rect.combo.mouse-activator { fill: #94e2d5; stroke: #94e2d5; }
    rect.combo.fn-activator { fill: #f9e2af; stroke: #f9e2af; }
    text.combo.mouse-activator, svg.combo.mouse-activator, text.combo.fn-activator, svg.combo.fn-activator { fill: #1e1e2e; }
    a[href="#Mouse"] text.combo.layer-activator { fill: #94e2d5; font-size: 9px; }
    a[href="#Fn"] text.combo.layer-activator { fill: #f9e2af; }
