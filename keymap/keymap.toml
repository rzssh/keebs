version = 1
layers = ["Graphium", "Vestnik", "Nav", "Sym", "Num", "Fn", "Mouse", "Magic"]
alpha_layers = ["Graphium", "Vestnik"]
default_layer = "Graphium"
default_os = "linux"
layer_source = "layers.toml"
behavior_source = "behaviors.toml"
profile_source = "profiles.json"
draw_combo_reference_layer = false
core34_setup = "right_space_split"
opposite_homing_tap = "backspace"

[features]
home_row_mods = { core30 = true, core34 = false }
graphite_right_hand = { core30 = false, core34 = true }
key_combos = { core30 = true, core34 = false }
key_combos_transient = { core30 = true, core34 = true }
bracket_combos = { core30 = true, core34 = false }
bracket_combos_transient = { core30 = true, core34 = true }
editing_combos = { core30 = true, core34 = false }
editing_combos_transient = { core30 = false, core34 = false }
nav_editing_keys = { core30 = false, core34 = true }
nav_meta_keys = { core30 = false, core34 = true }
layer_thumb_taps = { core30 = false, core34 = false }

[[layer_stacks]]
layers = ["Sym", "Num"]
positions = ["L_THUMB_A", "R_THUMB_B"]
variants = ["core34"]
setups = ["right_space_split"]

[[conditional_layers]]
if_layers = ["Nav", "Sym"]
then_layer = "Num"
variants = ["core30"]

[[conditional_layers]]
if_layers = ["Nav", "Sym"]
then_layer = "Mouse"
variants = ["core34"]
setups = ["right_space_split"]

[operating_systems.linux]
home = { key = "HOME" }
end = { key = "END" }
word_right = { key = "RIGHT", mods = ["LCTRL"] }
word_left = { key = "LEFT", mods = ["LCTRL"] }
select_word_right = { key = "RIGHT", mods = ["LCTRL", "LSHIFT"] }
select_line_end = { key = "END", mods = ["LSHIFT"] }
delete_word_left = { key = "BSPC", mods = ["LCTRL"] }
delete_word_right = { key = "DEL", mods = ["LCTRL"] }
undo = { key = "Z", mods = ["LCTRL"] }
redo = { key = "Z", mods = ["LCTRL", "LSHIFT"] }
cut = { key = "X", mods = ["LCTRL"] }
copy = { key = "INS", mods = ["LCTRL"] }
paste = { key = "V", mods = ["LCTRL"] }
select_all = { key = "A", mods = ["LCTRL"] }
screenshot_full = { key = "P", mods = ["LGUI", "LSHIFT"] }
screenshot_area = { key = "S", mods = ["LGUI", "LSHIFT"] }

[operating_systems.macos]
home = { key = "LEFT", mods = ["LGUI"] }
end = { key = "RIGHT", mods = ["LGUI"] }
word_right = { key = "RIGHT", mods = ["LALT"] }
word_left = { key = "LEFT", mods = ["LALT"] }
select_word_right = { key = "RIGHT", mods = ["LALT", "LSHIFT"] }
select_line_end = { key = "RIGHT", mods = ["LGUI", "LSHIFT"] }
delete_word_left = { key = "BSPC", mods = ["LALT"] }
delete_word_right = { key = "DEL", mods = ["LALT"] }
undo = { key = "Z", mods = ["LGUI"] }
redo = { key = "Z", mods = ["LGUI", "LSHIFT"] }
cut = { key = "X", mods = ["LGUI"] }
copy = { key = "C", mods = ["LGUI"] }
paste = { key = "V", mods = ["LGUI"] }
select_all = { key = "A", mods = ["LGUI"] }
screenshot_full = { key = "N3", mods = ["LGUI", "LSHIFT"] }
screenshot_area = { key = "N4", mods = ["LGUI", "LSHIFT"] }

[operating_systems.windows]
home = { key = "HOME" }
end = { key = "END" }
word_right = { key = "RIGHT", mods = ["LCTRL"] }
word_left = { key = "LEFT", mods = ["LCTRL"] }
select_word_right = { key = "RIGHT", mods = ["LCTRL", "LSHIFT"] }
select_line_end = { key = "END", mods = ["LSHIFT"] }
delete_word_left = { key = "BSPC", mods = ["LCTRL"] }
delete_word_right = { key = "DEL", mods = ["LCTRL"] }
undo = { key = "Z", mods = ["LCTRL"] }
redo = { key = "Y", mods = ["LCTRL"] }
cut = { key = "X", mods = ["LCTRL"] }
copy = { key = "INS", mods = ["LCTRL"] }
paste = { key = "INS", mods = ["LSHIFT"] }
select_all = { key = "A", mods = ["LCTRL"] }
screenshot_full = { key = "S", mods = ["LGUI", "LSHIFT"] }
screenshot_area = { key = "S", mods = ["LGUI", "LSHIFT"] }
