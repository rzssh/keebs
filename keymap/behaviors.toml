[adaptives.graphium]
enabled = true
timeout_ms = 1000
strict_modifiers = true
swaps_enabled = true
swaps = [
  ["S", "C", "D"],
  ["P", "H", "N"],
  ["C", "S", "X"],
  ["U", "E", "O"],
  ["W", "S", "D"],
  ["S", "W", "X"],
  ["P", "Y", "X"],
]
rules = [
  { input = "O", after = ["J", "U"], emit = ["BSPC", "O", "U"], allow_shift = true },
  { input = "S", after = ["Y", "O", "U"], emit = ["SQT"] },
  { input = "S", after = ["T", "H", "E", "Y"], emit = ["SQT"] },
  { input = "O", after = ["I", "U"], emit = ["BSPC", "O", "U"] },
  { input = "T", after = ["N", "R"], emit = ["BSPC", "T", "R"] },
]

[adaptives.graphium.variant_swaps]
core30 = [["R", "L", "J"]]
core34 = [["R", "L", "Z"]]

[adaptives.vestnik]
enabled = true
timeout_ms = 1000
strict_modifiers = true
swaps_enabled = true
swaps = [
  ["Р", "Н", "Й"],
  ["И", "Ю", "У"],
  ["Л", "Н", "Й"],
  ["Я", "Е", "О"],
  ["У", "Е", "О"],
]
rules = [
  { input = "О", after = ["Т", "С"], emit = ["Т"] },
  { input = "Й", after = ["Н", "Т"], emit = ["Р"] },
  { input = "Й", after = ["Р", "Т"], emit = ["Н"] },
]

[adaptives.vestnik_core34]
