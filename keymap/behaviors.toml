  { after_any = ["Б", "В", "Г", "Д", "Ж", "З", "К", "Л", "М", "Н", "П", "Р", "С", "Т", "Ф", "Х", "Ц", "Ч", "Ш", "Щ"], emit = ["Ь"], timeout_ms = 10000, strict_modifiers = false },
